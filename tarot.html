<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Widget Tarot Dinámico</title>
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
      @font-face {
        font-family: "Mleitod";
        src: url("./Mleitod.ttf") format("truetype");
      }
      @font-face {
        font-family: "file000541";
        src: url("./file000541.ttf") format("truetype");
      }
      /* --- Estilos base (el resto sigue igual) --- */
      :root {
        --bg-dark: transparent;
        --dinamic-font: sans-serif;
        --base-color: #ffe9d0;
        --accent: #00ff37;
      }
      body {
        background-color: var(--bg-dark) !important;
        font-family: monospace;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: white;
      }
      .widget-container {
        position: relative;
        width: 400px;
        height: 600px;
        perspective: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .mystic-hand {
        position: absolute;
        bottom: 0; /* Pegado siempre al suelo del widget */
        left: 50%;
        margin-left: -240px; /* Centrado para un ancho de 480px */
        width: 480px; /* Más grande que la carta */
        transform: translateY(120%);
        opacity: 0;
        transition:
          transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          opacity 0.2s;
        pointer-events: none;
      }
      .layer-back {
        z-index: 10;
      } /* Por detrás de la carta */
      .tarot-card {
        z-index: 20;
      } /* La carta en medio */
      .layer-front {
        z-index: 30;
      } /* Por delante de la carta */

      /* Clases de control JS */
      .hand-show {
        transform: translateY(0);
        opacity: 1;
      }
      .hand-pull {
        transform: translateY(120%);
        transition: transform 0.25s ease-in; /* Tirón rápido hacia abajo */
      }
      .no-transition {
        transition: none !important;
      }

      #tension-counter {
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 24px;
        font-weight: bold;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent);
        z-index: 20;
        font-family: var(--dinamic-font);
        opacity: 0.8;
      }
      .tarot-card {
        width: 320px;
        height: 480px;
        position: relative;
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
        cursor: pointer;
        margin-bottom: 20px;
      }
      .tarot-card.is-flipped {
        transform: rotateY(180deg);
      }
      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        border: 2px solid var(--accent);
      }
      .card-front {
        background-color: #111;
        background-size: cover;
        background-position: center;
      }
      .card-back {
        background-color: var(--base-color);
        transform: rotateY(180deg);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .brutalist-container {
        --escala-dinamica: 1;
        --rotacion-bloque: 0deg;
        font-family: var(--dinamic-font);
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        line-height: 0.72;
        text-transform: uppercase;
        mix-blend-mode: exclusion;
        animation: floatBlock 4s ease-in-out infinite alternate;
      }
      @keyframes floatBlock {
        0% {
          transform: scale(calc(var(--escala-dinamica) * 0.99))
            rotate(calc(var(--rotacion-bloque) - 0.5deg));
        }
        100% {
          transform: scale(calc(var(--escala-dinamica) * 1.01))
            rotate(calc(var(--rotacion-bloque) + 0.5deg));
        }
      }
      .brutalist-word {
        display: block;
        white-space: nowrap;
        transform-origin: center center;
        opacity: 0;
        animation: slamWord 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }
      @keyframes slamWord {
        0% {
          opacity: 0;
          transform: scale(1.2);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      #shuffle-animation {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        z-index: 10;
        display: none;
        pointer-events: none;
      }
      .controls {
        display: flex;
        gap: 15px;
        opacity: 0.1;
        transition: opacity 0.3s;
      }
      .controls:hover {
        opacity: 1;
      }
      button {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 8px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }
      #loading {
        position: absolute;
        z-index: 50;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 8px;
        font-family: var(--dinamic-font);
      }
    </style>
  </head>
  <body>
    <div class="widget-container">
      <div id="loading">Conectando con el Oráculo...</div>
      <div id="tension-counter">[0/0]</div>
      <!-- Capas de las manos mágicas -->
      <!-- Coreografía de manos -->
      <img
        src="./img/manos.png"
        id="hand-relaxed"
        class="mystic-hand layer-front"
      />
      <img
        src="./img/manos2.png"
        id="hand-pinch"
        class="mystic-hand layer-front"
      />
      <img
        src="./img/manos3.png"
        id="hand-hold"
        class="mystic-hand layer-back"
      />
      <div id="card" class="tarot-card">
        <div id="card-front-img" class="card-face card-front"></div>
        <div class="card-face card-back">
          <div id="card-text" class="brutalist-container"></div>
        </div>
      </div>

      <div class="controls">
        <button onclick="drawCard()">Forzar Carta (Test)</button>
        <button onclick="resetDeck()">Resetear Mazo</button>
      </div>
    </div>

    <!-- Script para inyectar configuraciones visuales desde la URL antes de cargar app.js -->
    <script>
      const localParams = new URLSearchParams(window.location.search);
      const fontName = localParams.get("font") || "Oswald";
      const bgImg = localParams.get("bg") || "";
      const baseColor = "#" + (localParams.get("base") || "ffe9d0");

      const fontLink = document.createElement("link");
      fontLink.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, "+")}&display=swap`;
      fontLink.rel = "stylesheet";
      document.head.appendChild(fontLink);

      document.documentElement.style.setProperty(
        "--dinamic-font",
        `"${fontName}", sans-serif`,
      );
      document.documentElement.style.setProperty("--base-color", baseColor);

      if (bgImg) {
        document.getElementById("card-front-img").style.backgroundImage =
          `url('${bgImg}')`;
      }
    </script>

    <!-- Carga del motor principal -->
    <script src="app.js"></script>
  </body>
</html>
