<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Back Office | Oráculo Brutalista</title>
    <style>
      :root {
        --bg: #10081c;
        --surface: #1e1332;
        --accent: #00ff37;
        --text: #e0f7fa;
        --border: #3b175d;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: monospace;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 600px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      }
      .full-width {
        grid-column: span 2;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: #a8e684;
        margin-bottom: 5px;
      }
      input,
      select {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        color: white;
        padding: 10px;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .color-grid {
        display: flex;
        gap: 10px;
      }
      input[type="color"] {
        width: 40px;
        height: 40px;
        padding: 0;
        border: none;
      }
      .output-box {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Lanzador del Oráculo</h1>
      <div class="grid">
        <div class="full-width">
          <label>Selecciona Streamer</label>
          <select id="profile" onchange="loadProfile()">
            <option value="sara">Sara (Brutalismo Ácido)</option>
            <option value="klau">Klauwasaki (Vibra Custom)</option>
            <option value="eskissmee">Eskissmee (Neón)</option>
          </select>
        </div>

        <div>
          <label>Usuario Twitch</label
          ><input type="text" id="twitchUser" value="sarachitv" />
        </div>
        <div>
          <label>Recompensa Twitch</label
          ><input type="text" id="rewardName" value="Sacar carta del tarot" />
        </div>

        <div class="full-width">
          <label>Fuente (Google Fonts)</label
          ><input type="text" id="fontName" value="Oswald" />
        </div>
        <div class="full-width">
          <label>Ruta de la Imagen del Dorso (Local o URL)</label>
          <input type="text" id="cardBack" value="./img/sara_dorso.jpg" />
        </div>

        <div>
          <label>Color Base Carta</label
          ><input type="color" id="baseColor" value="#ffe9d0" />
        </div>
        <div>
          <label>Paleta de Textos (5 Tonos)</label>
          <div class="color-grid">
            <input type="color" id="c1" value="#a8e684" />
            <input type="color" id="c2" value="#00e5ff" />
            <input type="color" id="c3" value="#ff2a9d" />
            <input type="color" id="c4" value="#ffd700" />
            <input type="color" id="c5" value="#ffffff" />
          </div>
        </div>
      </div>

      <div class="output-box">
        <label>ENLACE LISTO PARA OBS (O NAVEGADOR)</label>
        <input type="text" id="finalUrl" readonly />
        <button onclick="copyUrl()">Copiar</button>
        <button
          onclick="abrirEditorGitHub()"
          style="background: #ff2a9d; margin-top: 10px; width: 100%"
        >
          ✏️ Editar Mazo en GitHub
        </button>
      </div>

      <div style="margin-top: 20px; text-align: center">
        <a
          href="#"
          id="testLink"
          target="_blank"
          style="color: var(--accent); text-decoration: none"
          >Abrir directamente en el navegador 🚀</a
        >
      </div>
    </div>

    <script>
      const profiles = {
        sara: {
          user: "sarachitv",
          font: "Oswald",
          base: "#ffe9d0",
          img: "./img/sara_dorso.jpg" /* O el nombre exacto de tu imagen */,
          csv: "sarachi.csv",
          colors: ["#a8e684", "#00e5ff", "#ff2a9d", "#ffd700", "#ffffff"],
        },
        klau: {
          user: "klauwasaki",
          font: "Mleitod",
          base: "#1a0b2e",
          img: "./img/klau_dorso.jpg",
          csv: "klauwasaki.csv",
          colors: ["#ff0055", "#b700ff", "#00ffcc", "#ffffff", "#ffaa00"],
        },
        eskissmee: {
          user: "eskissmee",
          font: "file000541",
          base: "#001133",
          img: "./img/eskiss_dorso.jpg" /* Cambia si es otro */,
          csv: "eskissmee.csv",
          colors: ["#00ff37", "#ffff00", "#ff0099", "#00eeff", "#ffffff"],
        },
      };

      function loadProfile() {
        const selected = document.getElementById("profile").value;
        localStorage.setItem("oraculo_profile", selected); // Guarda el perfil en el navegador

        const p = profiles[selected];
        document.getElementById("twitchUser").value = p.user;
        const p = profiles[document.getElementById("profile").value];
        document.getElementById("twitchUser").value = p.user;
        document.getElementById("fontName").value = p.font;
        document.getElementById("baseColor").value = p.base;
        document.getElementById("cardBack").value = p.img;
        for (let i = 0; i < 5; i++)
          document.getElementById("c" + (i + 1)).value = p.colors[i];
        generateUrl();
      }

      function generateUrl() {
        let currentPath = window.location.href.split("?")[0];
        if (currentPath.endsWith("index.html"))
          currentPath = currentPath.replace("index.html", "tarot.html");
        else if (!currentPath.endsWith("/")) currentPath += "/tarot.html";
        else currentPath += "tarot.html";

        // Asegúrate de tener estas dos líneas exactas:
        const p = profiles[document.getElementById("profile").value];
        const params = new URLSearchParams({
          user: document.getElementById("twitchUser").value,
          reward: document.getElementById("rewardName").value,
          font: document.getElementById("fontName").value,
          bg: document.getElementById("cardBack").value,
          base: document.getElementById("baseColor").value.replace("#", ""),
          deck: p.csv, // <--- ESTA ES LA MAGIA QUE SEPARA LOS MAZOS
          pal: [1, 2, 3, 4, 5]
            .map((i) => document.getElementById("c" + i).value.replace("#", ""))
            .join("-"),
        });

        const url = `${currentPath}?${params.toString()}`;
        document.getElementById("finalUrl").value = url;
        document.getElementById("testLink").href = url;
      }

      function copyUrl() {
        document.getElementById("finalUrl").select();
        document.execCommand("copy");
      }

      document
        .querySelectorAll("input, select")
        .forEach((el) => el.addEventListener("input", generateUrl));
      generateUrl();

      function abrirEditorGitHub() {
        const p = profiles[document.getElementById("profile").value];
        window.open(
          `https://github.com/sarache/tarot-paradise/edit/main/data/${p.csv}`,
          "_blank",
        );
      }
    </script>
  </body>
</html>
